name: Deploy to GitHub Pages

# Builds the site and pushes it to the gh-pages branch, which GitHub Pages
# serves. `npm run deploy` does the same from a local machine, so the site
# can be published even when Actions is unavailable.
on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Astro 7 needs Node 22.23.4 or later.
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: scripts/deploy.sh
